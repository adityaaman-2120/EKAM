# ULPF global configuration.
# Every value here can be overridden by an environment variable prefixed with
# ULPF_ , using __ as the section delimiter, e.g. ULPF_INGEST__SYSLOG_UDP_PORT=1514

ingest:
  syslog_udp_port: 514
  # Requested SO_RCVBUF for the UDP listener; the OS may grant less (the
  # actual size is logged at startup). Raises the burst UDP can absorb before
  # dropping datagrams -- it does not make UDP lossless. Benchmark and
  # verification runs must use TCP (see CLAUDE.md).
  syslog_udp_recv_buffer_bytes: 4194304
  syslog_tcp_port: 514
  syslog_tls_port: 6514
  http_port: 8081
  http_max_body_bytes: 8388608
  queue_max_size: 100000
  file_tail_paths: []

storage:
  bronze_path: data/runtime/bronze
  silver_path: data/runtime/silver
  dlq_path: data/runtime/dlq
  ledger_path: data/runtime/ledger
  state_path: data/runtime/state

tls:
  cert_path: null
  key_path: null
  client_ca_path: null
  require_client_cert: false
  minimum_version: TLSv1_2

parse:
  sources_dir: configs/sources
  hot_reload: true
  grok_timeout_ms: 100

integrity:
  enabled: true
  batch_size: 1000              # seal a batch after this many events...
  batch_timeout_seconds: 10     # ...or after this long, whichever comes first
  # Ed25519 keys from `ulpf keys generate --out deploy/keys/`. The private key
  # is gitignored — generate it once per deployment. If the file is missing,
  # `ulpf run` prints a loud INTEGRITY LEDGER IS OFF banner and keeps running
  # without sealing (raw events are still stored; they are just not signed).
  signing_key_path: deploy/keys/ulpf_ed25519_private.pem
  public_key_path: deploy/keys/ulpf_ed25519_public.pem

enrich:
  # Optional MaxMind GeoLite2 databases. Leave null to run without geo/ASN
  # enrichment (the enricher self-disables). See deploy/data/README.md to obtain
  # them; the .mmdb files are never committed.
  geoip_db_path: null          # e.g. deploy/data/GeoLite2-City.mmdb
  geoip_asn_db_path: null       # e.g. deploy/data/GeoLite2-ASN.mmdb
  ioc_path: null
  ioc_dir: configs/iocs         # threat-intel indicator sets (*.json), hot-reloaded
  assets_path: configs/assets.yaml
  attack_map_path: configs/attack_map.yaml   # rule -> MITRE ATT&CK technique map
  enabled: true                 # master switch for the whole enrichment stage
  timeout_ms: 50                 # hard per-enricher budget (ms)
  network_context: true          # RFC classification, asset zone, direction (pure Python)
  geoip: true                    # MaxMind GeoLite2 (optional; self-disables if absent)
  threat_intel: true             # IOC matching against configs/iocs/*.json
  attack_tagger: true            # MITRE ATT&CK technique tagging

pipeline:
  worker_count: 4
  batch_size: 500

api:
  host: 0.0.0.0
  port: 8080
