# ULPF supporting infrastructure.
#
# The ULPF application service is deliberately NOT defined here yet — this file
# only stands up the datastores and broker it will depend on.
#
#   docker compose up -d          # start clickhouse + minio + redpanda
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#                                 # start clickhouse only (see the override file)

name: ulpf

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ulpf-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native protocol
    environment:
      CLICKHOUSE_DB: ulpf
      CLICKHOUSE_USER: ulpf
      CLICKHOUSE_PASSWORD: ulpf
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "ulpf", "--password", "ulpf", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: ulpf-minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ulpf
      MINIO_ROOT_PASSWORD: ulpf-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: ulpf-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --node-id=0
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # external Kafka API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
  redpanda-data:
